services:
  - type: web
    name: growthradar-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MARKET_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
